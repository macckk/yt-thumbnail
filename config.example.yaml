# Configuração de exemplo do yt-thumbnail.
# Copie para `config.yaml` (que fica FORA do git) e preencha com seus dados.
# Referência completa: docs/configuracao.md

caminhos:
  saida: saida                 # artefatos por job/vídeo
  secrets: secrets             # client_secret.json e tokens/ ficam aqui
  presets: presets
  prompts: prompts

gpu:
  transcricao: 0               # índice da GPU para o faster-whisper
  imagem: 1                    # índice da GPU para o SDXL (UNet + VAE)
  texto_sdxl: null             # GPU dos codificadores de texto do SDXL (~1,6 GB); null = a de transcrição

ytdlp:
  cookies_navegador: null      # ex.: firefox — só se o YouTube pedir login/bloquear o yt-dlp

transcricao:
  idiomas: ["pt", "pt-BR", "pt.*"]  # idiomas de legenda aceitos, em ordem de preferência
  idioma_whisper: pt           # idioma passado ao faster-whisper
  modelo_whisper: large-v3     # ou "turbo" (mais rápido)
  compute_type: float16
  manter_audio: false          # true guarda o audio.m4a depois de transcrever
  whisper_se_legenda_falhar: true  # se o YouTube bloquear a legenda (HTTP 429), usa o Whisper
  pausa_legendas_segundos: 1   # pausa entre downloads de legenda (evita bloqueio 429)

analise:
  backend: claude_code         # backend padrão (claude -p)
  modelo: null                 # ex.: sonnet; null = padrão do Claude Code
  tentativas: 2                # novas tentativas se o JSON vier inválido
  max_caracteres_transcricao: 20000  # acima disso usa início + meio + fim da transcrição
  timeout_segundos: 300
  saida_estruturada: true      # passa o esquema JSON ao claude (--json-schema)
  template: analise.md         # arquivo em prompts/

imagem:
  modelo: stabilityai/stable-diffusion-xl-base-1.0
  variacoes: 3
  attention_slicing: false     # true se faltar VRAM (um pouco mais lento)
  cpu_offload: false           # true com uma GPU só de 8 GB (só a parte ativa fica na GPU; usa bem mais RAM)

formatos:
  longo:
    geracao: [1344, 768]
    saida: [1280, 720]
  short:
    geracao: [768, 1344]
    saida: [1080, 1920]

envio:
  pausa_segundos: [5, 10]      # pausa aleatória entre envios

canais:
  espiritual-principal:
    channel_id: null           # preenchido pelo `yt-thumbnail auth --canal espiritual-principal`
    shorts_capa_personalizada: false  # true só para canais no Programa de Parcerias (YPP)

jobs:
  - nome: meditacoes
    playlist: https://www.youtube.com/playlist?list=SUA_PLAYLIST_AQUI
    canal: espiritual-principal
    preset: espiritualidade
    tipos: [longo]             # adicione `short` para também gerar capas de Shorts
